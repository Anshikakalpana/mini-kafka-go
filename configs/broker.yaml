broker:
  service:
    name: broker-1
    dataDir: ./data/broker-1
    host: localhost
    port: 8080

  segment:
    maxMessageBytes: 10485760     # 10MB
    maxSegmentBytes: 104857600    # 100MB
    flushIntervalMs: 5000
    flushMessages: 10000

  retention:
    maxAgeSeconds: 604800
    maxBytes: 1073741824
    checkIntervalMs: 300000

  logging:
    level: info
    logDir: ./logs/broker-1
    maxLogFiles: 10
    maxLogSizeBytes: 104857600
